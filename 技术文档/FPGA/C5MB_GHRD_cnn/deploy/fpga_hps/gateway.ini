# C5MB direct pure-Verilog CNN service. Raspberry Pi connects to port 8082.
bind_address=0.0.0.0
port=8082
max_upload_bytes=16777216

# Generated from the user's ssd_mobilenet_v1_qat export.
model_directory=model
cma_device=/dev/cmadrv0
cnn_base=0xff200000
cnn_timeout_ms=60000
cnn_poll_interval_us=50
channel_order=BGR
score_threshold=0.20

pl_sort_enabled=true
pl_sort_base=0xff200800
pl_sort_clock_hz=50000000
pl_watchdog_ms=85000
pl_four_class_mode=false

# false: defect -> left with alarm, normal -> right without alarm.
# Change only this value if the on-site direction is confirmed opposite.
pl_swap_sides=false
pl_thresholds=0.70,0.70,0.70,0.20,0.70